# ShareEK - شريك العقاري
# Supabase Local & CLI Project Configuration

project_id = "shareek-real-estate"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "https://share-ek.com"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://127.0.0.1:3000",
  "https://share-ek.com/*"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[storage]
enabled = true
file_size_limit = "20MiB"

[storage.buckets.property-images]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/webp", "image/jpeg", "image/png"]

[storage.buckets.property-documents]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/webp", "image/jpeg", "image/png", "application/pdf"]

[storage.buckets.admin-reports]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/pdf", "image/jpeg"]
